<html>
  <head>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Quicksand:wght@600&display=swap" rel="stylesheet">

    <style>
      :root {
        --primary-bg: #1a103d;
        --secondary-bg: #24184f;
        --navbar-bg: #2d1d5e;
        --quicklink-bg: #2a1753;
        --quicklink-hover: #3a216e;
        
        --accent-dark: #6a3d9a;
        --accent-darker: #5a2d8a;
        --accent-hover: #9d6dc9;
        --accent-blue: #3d1d9a;
        --accent-blue-dark: #4a25b3;
        
        --text-white: #f5f0ff;
        --text-gray: #d9cbf7;
        --text-disabled: #6d5a8f;
        
        --border-primary: #6a3d9a;
        --border-secondary: #8a5dba;
        --border-white: #f5f0ff;
        --border-pink: #c79ae8;
        
        --shadow-primary: rgba(106, 61, 154, 0.5);
        --shadow-secondary: rgba(138, 93, 186, 0.5);
        --shadow-pink: rgba(199, 154, 232, 0.6);
        --shadow-white: rgba(245, 240, 255, 0.2);
        
        --loading-spinner: #9d6dc9;
        --roddy-box-bg: rgba(36, 24, 79, 0.9);
      }

      * {
        font-family: 'Quicksand', sans-serif;
        font-weight: 600;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: var(--primary-bg);
      }

      .page-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 20px;
      }

      h1 {
        color: var(--text-white);
        margin: 0;
        font-size: 1.3em;
      }
      
      p {
        color: var(--text-white);
        margin: 0;
        font-size: 0.8em;
      }

      .btn-container {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }

      .bookmarklet-btn {
        font-size: 1.2em;
        padding: 10px 20px;
        margin: 10px;
        background-color: var(--primary-bg);
        color: var(--text-white);
        border-radius: 8px;
        outline: 2px solid var(--accent-dark);
        border: 4px solid transparent;
        cursor: pointer;
        transition: all .2s ease-in-out; 
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      }

      .bookmarklet-btn:hover {
        border: 4px solid var(--accent-dark);
        box-shadow: 0 0 10px var(--accent-dark), 0 0 20px var(--accent-dark), 0 0 30px var(--accent-dark);
        transition: all .2s ease-in-out; 
        outline: 2px solid transparent;
      }

      .bookmarklet-btn:disabled {
        cursor: not-allowed;
        font-size: 1.2em;
        padding: 10px 20px;
        margin: 10px;
        background-color: var(--primary-bg);
        color: var(--text-white);
        border-radius: 8px;
        outline: 2px solid var(--text-disabled);
        border: 4px solid transparent;
        transition: all .2s ease-in-out; 
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      }

      .bookmarklet-btn:hover:disabled {
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    
    <div class="page-wrapper">
      <h1>LOLLLLLLL I GOT ACCESS AGAIN</h1>
      <h1>SOLO CENTRAL ON TOP YOU BUM</h1>
      <h1>HAYDEN FILES COMING SOON!!!</h1>
      
      <div class="btn-container">
        <button class="bookmarklet-btn" onclick="window.open('https://cash.app/$qatual', '_blank')">dono: cashapp</button>
        <button class="bookmarklet-btn" onclick="window.open('https://62-84-183-198.plesk.page/qatual/qatual/hvtrs8%2F-wuw%2Crmbnoz.aoo%2Feidt%2Frmbwx%3Duqep%3D%3B4486643', '_blank')">dono: robux</button>
      </div>
      <p>donating means alot to me and would really help ❤️</p>
    </div>

  </body>
</html>
